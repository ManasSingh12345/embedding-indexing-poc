# OpenSearch + GPU remote index builder (CAGRA → HNSW). No cuVS bench.
#
#   sysctl -w vm.max_map_count=262144
#   docker compose --profile gpu up --build -d --wait
#
# Optional NGC builder image:
#   REMOTE_INDEX_BUILDER_IMAGE=nvcr.io/r2kuatviomfd/internal-sandbox/opensearchproject-remote-vector-index-builder:api-latest
#
# Local S3 (when AWS SSO is unavailable):
#   COMPOSE_PROFILES=gpu,local-s3

x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_REGION: ${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-2}}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
  S3_BUCKET: ${S3_BUCKET:-}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
  AWS_S3_ENDPOINT: ${AWS_ENDPOINT_URL:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-true}
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

services:
  opensearch:
    build:
      context: ./deploy/opensearch
    container_name: opensearch
    environment:
      <<: *aws-env
      cluster.name: embedding-indexing-poc
      node.name: opensearch-node-1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms16g -Xmx16g -Daws.requestChecksumCalculation=WHEN_REQUIRED -Daws.responseChecksumValidation=WHEN_REQUIRED}
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./deploy/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s

  # GPU CAGRA build. OpenSearch itself stays on CPU; this service is the GPU path.
  remote-index-builder:
    profiles: [gpu]
    image: ${REMOTE_INDEX_BUILDER_IMAGE:-opensearchproject/remote-vector-index-builder:api-latest}
    container_name: remote-index-builder
    restart: unless-stopped
    gpus:
      - driver: nvidia
        device_ids: ["${NVIDIA_VISIBLE_DEVICES:-0}"]
        capabilities: [gpu]
    environment:
      <<: *aws-env
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      MAX_WORKERS: ${MAX_WORKERS:-1}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; socket.create_connection((\"localhost\", 1025), 2).close()'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_VISIBLE_DEVICES:-0}"]
              capabilities: [gpu]

  localstack:
    profiles: [local-s3]
    image: localstack/localstack:3.8
    container_name: localstack
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  opensearch-data:
  localstack-data:
